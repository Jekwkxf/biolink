<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1">
    <title>🙈</title>

        <!-- Open Graph meta tags for Discord Embed -->
    <meta  property="og:title" content="🙈">
    <meta property="og:description" content="Yo Monkey">
    <meta property="og:url" content="https://wock.wtf/🙈"> <!-- Replace with your actual URL -->

    <!-- Font and styles -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        html, body {
            background-color: black;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            height: 100vh;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        a {
            color: white;
            text-decoration: none;
            font-size: 16px; /* Smaller text */
        }

        a:hover {
            text-decoration: underline;
        }

        iframe {
            margin-top: 20px;
            width: 300px;  /* Smaller width */
            height: 80px;  /* Smaller height */
            border-radius: 12px;
        }

        img {
            width: 120px; /* Set the size of the profile picture */
            height: 120px;
            border-radius: 50%; /* Make the image circular */
            margin-bottom: 20px; /* Add space between the image and the link */
        }
    </style>
</head>
<body>
    <!-- Profile Picture (PFP) -->
   
    <a href="Baby I'm Sorry ❤️❤️">I'm sorry baby</a>
    
    <!-- Spotify Embed (Smaller size) -->
    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/5QO79kh1waicV47BqGRL3g?utm_source=generator" width="300" height="80" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

</body>
</html>
